<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIコンシェルジュ β | Restaurant Review Analyzer</title>
    <link rel="stylesheet" href="/static/css/style.css?v={{ css_version }}" />
  </head>

  <body class="consumer-chat-page">
    <header class="consumer-chat-header">
      <a href="/" class="consumer-chat-logo">Restaurant Review Analyzer</a>
      <a href="/consumer" class="consumer-chat-nav">お店探しへ戻る</a>
    </header>

    <main>
      <section class="consumer-chat-hero">
        <div class="consumer-chat-hero-image">
          <img
            src="/static/images/consumer-chat-hero.jpg"
            alt="食事を楽しむ人たち"
          />
        </div>

        <div class="consumer-chat-hero-content">
          <span class="beta-badge">β版</span>
          <p class="consumer-chat-label">AI Restaurant Concierge</p>

          <h1>
            口コミから、<br />
            お店選びを相談する。
          </h1>

          <p class="consumer-chat-lead">
            気分やシーンに合わせて、AIがお店探しのヒントを提案します。
            現在はデモデータを利用したβ版です。
          </p>
        </div>
      </section>

      <section class="consumer-chat-section">
        <div class="consumer-chat-card">
          <div class="concierge-intro">
            <div class="concierge-icon">🍽️</div>
            <div>
              <p class="consumer-chat-label">Concierge Chat</p>
              <h2>AIコンシェルジュに相談</h2>
              <p>
                「一人で入りやすい店」「静かなカフェ」など、条件に合わせておすすめを聞けます。
              </p>
            </div>
          </div>

          <div class="concierge-suggestions">
            <button
              type="button"
              onclick="setConciergeQuestion('ラーメンが食べたい')"
            >
              🍜 ラーメンが食べたい
            </button>
            <button
              type="button"
              onclick="setConciergeQuestion('静かなカフェを探したい')"
            >
              ☕ 静かなカフェを探したい
            </button>
            <button
              type="button"
              onclick="setConciergeQuestion('デート向けのお店は？')"
            >
              💑 デート向けのお店は？
            </button>
            <button
              type="button"
              onclick="setConciergeQuestion('一人でも入りやすい店は？')"
            >
              👤 一人でも入りやすい店は？
            </button>
          </div>

          <div id="concierge-history" class="concierge-history"></div>

          <textarea
            id="concierge-question"
            class="concierge-textarea"
            rows="3"
            placeholder="例：今日は軽めに食べたい。落ち着いたお店ある？"
          ></textarea>

          <button
            type="button"
            class="concierge-button"
            onclick="askConcierge()"
          >
            相談する
          </button>

          <p class="consumer-chat-note">
            ※
            現在はデモデータを利用したβ版です。将来的には店舗データや位置情報検索への対応を想定しています。
          </p>
        </div>
      </section>
    </main>

    <footer class="consumer-chat-footer">© Restaurant Review Analyzer</footer>

    <script>
      function addConciergeMessage(role, text) {
        const history = document.getElementById("concierge-history");
        const row = document.createElement("div");
        row.className =
          role === "user" ? "concierge-row user" : "concierge-row ai";

        if (role === "user") {
          row.innerHTML = `<div class="concierge-bubble user">${text}</div>`;
        } else {
          row.innerHTML = `
            <div class="concierge-avatar">🍽️</div>
            <div class="concierge-bubble ai">
              <div class="concierge-name">AIコンシェルジュ</div>
              <div>${text}</div>
            </div>
          `;
        }

        history.appendChild(row);
        history.scrollTop = history.scrollHeight;
      }

      function setConciergeQuestion(text) {
        document.getElementById("concierge-question").value = text;
      }

      function askConcierge() {
        const input = document.getElementById("concierge-question");
        const question = input.value.trim();

        if (!question) {
          addConciergeMessage("ai", "気分や食べたいものを入力してね。");
          return;
        }

        addConciergeMessage("user", question);
        input.value = "";

        const answer = getDemoConciergeAnswer(question);
        setTimeout(() => {
          addConciergeMessage("ai", answer);
        }, 500);
      }

      function getDemoConciergeAnswer(question) {
        if (question.includes("ラーメン")) {
          return "ラーメンなら「麺処さくら」がおすすめです。濃厚スープと自家製麺が人気で、満足感のある一杯を楽しめます。";
        }

        if (question.includes("カフェ") || question.includes("静か")) {
          return "静かに過ごしたいなら「ガーデンカフェ」が合いそうです。落ち着いた雰囲気で、ひと息つきたい時に向いています。";
        }

        if (question.includes("デート")) {
          return "デートなら「鮨みなと」がおすすめです。特別感があり、落ち着いた食事時間を楽しめそうです。";
        }

        if (question.includes("一人")) {
          return "一人で入りやすいなら「麺処さくら」か「ガーデンカフェ」が良さそうです。気軽さならラーメン、ゆっくり過ごすならカフェですね。";
        }

        return "今の気分なら、まずは「ガーデンカフェ」が使いやすそうです。軽めに過ごせて、落ち着いた時間を取りやすいお店です。";
      }

      window.addEventListener("DOMContentLoaded", () => {
        addConciergeMessage(
          "ai",
          "こんにちは。食べたいものやシーンを教えてください。デモデータからおすすめを提案します。",
        );

        const input = document.getElementById("concierge-question");
        input.addEventListener("keydown", function (e) {
          if (e.isComposing || e.keyCode === 229) return;

          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            askConcierge();
          }
        });
      });
    </script>
  </body>
</html>
